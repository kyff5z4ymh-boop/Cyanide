name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Archive
        run: |
          xcodebuild -workspace YourProject.xcworkspace \
                     -scheme YourScheme \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath $PWD/build/YourApp.xcarchive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (Unsigned)
        run: |
          mkdir -p Payload
          cp -r build/YourApp.xcarchive/Products/Applications/*.app Payload/
          zip -r YourApp.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: YourApp.ipa
